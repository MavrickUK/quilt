<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quilt Pattern Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>1Cell Quilt Pattern Generator</h1>
  <div class="app">
    <aside class="colors-panel">
      <section>
        <h2>Colours</h2>
        <div id="color-list"></div>

        <p class="sub-label">Quick pick:</p>
        <div id="palette" class="palette"></div>

        <p class="sub-label">Custom colour:</p>
        <div class="add-color">
          <div class="color-preview" id="color-preview"></div>
          <input type="color" id="new-color" value="#e66465">
          <input type="text" id="new-color-name" placeholder="Colour name" autocomplete="off">
        </div>
        <button type="button" id="add-color-btn" class="add-btn">Add Colour</button>
      </section>
    </aside>

    <main>
      <div id="quilt-grid" class="quilt-grid"></div>
      <div id="legend" class="legend"></div>
    </main>

    <aside class="controls-panel">
      <section>
        <h2>Grid Size</h2>
        <div class="field">
          <label for="rows">Rows</label>
          <input type="number" id="rows" min="1" max="50" value="10">
        </div>
        <div class="field">
          <label for="cols">Columns</label>
          <input type="number" id="cols" min="1" max="50" value="10">
        </div>
      </section>

      <section>
        <div class="checkbox-field">
          <input type="checkbox" id="no-adjacent" checked>
          <label for="no-adjacent">No adjacent same colours</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="show-numbers">
          <label for="show-numbers">Show colour numbers</label>
        </div>
      </section>

      <div id="warnings"></div>

      <button id="generate-btn" class="primary-btn">Generate Pattern</button>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
