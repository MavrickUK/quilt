<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quilt Pattern Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Quilt Pattern Generator</h1>
  <div class="app">
    <aside class="settings">
      <section>
        <h2>Grid Size</h2>
        <div class="field">
          <label for="rows">Rows</label>
          <input type="number" id="rows" min="1" max="50" value="10">
        </div>
        <div class="field">
          <label for="cols">Columns</label>
          <input type="number" id="cols" min="1" max="50" value="10">
        </div>
      </section>

      <section>
        <h2>Colors</h2>
        <div id="color-list"></div>

        <p class="sub-label">Quick pick:</p>
        <div id="palette" class="palette"></div>

        <p class="sub-label">Custom color:</p>
        <div class="add-color">
          <label class="color-preview" id="color-preview">
            <input type="color" id="new-color" value="#e66465">
          </label>
          <input type="text" id="new-color-name" placeholder="Color name" autocomplete="off">
          <button type="button" id="add-color-btn">Add Color</button>
        </div>
      </section>

      <div id="warnings"></div>

      <button id="generate-btn" class="primary-btn">Generate Pattern</button>
    </aside>

    <main>
      <div id="quilt-grid" class="quilt-grid"></div>
      <div id="legend" class="legend"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
